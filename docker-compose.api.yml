name: eduplexo-api

services:
  # ─── PostgreSQL 16 Database ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduplexo_prod}
      POSTGRES_USER: ${POSTGRES_USER:-eduplexo_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eduplexo_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_connections=100
      -c wal_buffers=16MB
      -c checkpoint_completion_target=0.9
      -c max_wal_size=2GB
      -c min_wal_size=1GB
      -c log_min_duration_statement=200
    deploy:
      resources:
        limits:
          memory: 3072M
          cpus: "2.0"
        reservations:
          memory: 1536M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eduplexo_app} -d ${POSTGRES_DB:-eduplexo_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ─── Redis 7 Cache & Queue ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --tcp-keepalive 300
      --timeout 300
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 640M
          cpus: "0.5"
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ─── Database Migrations (One-shot) ──────────────────────────────────
  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend-go/migrations:/migrations:ro
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://${POSTGRES_USER:-eduplexo_app}:${POSTGRES_PASSWORD:-eduplexo_pass_2026}@postgres:5432/${POSTGRES_DB:-eduplexo_prod}?sslmode=disable",
        "up",
      ]
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Go Backend API ──────────────────────────────────────────────────
  backend-go:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: "8080"
      APP_NAME: school
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://app.eduplexo.com,https://admin.eduplexo.com}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      JWT_SECRET: ${JWT_SECRET:-dev-secretttyt}
      DATABASE_URL: postgres://${POSTGRES_USER:-eduplexo_app}:${POSTGRES_PASSWORD:-eduplexo_pass_2026}@postgres:5432/${POSTGRES_DB:-eduplexo_prod}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GOMAXPROCS: "4"
      GOMEMLIMIT: "900MiB"
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "2.0"
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ─── Background Worker ───────────────────────────────────────────────
  worker:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: "8081"
      APP_NAME: school
      WORKER_MODE: "true"
      JWT_SECRET: ${JWT_SECRET:-dev-secretttyt}
      DATABASE_URL: postgres://${POSTGRES_USER:-eduplexo_app}:${POSTGRES_PASSWORD:-eduplexo_pass_2026}@postgres:5432/${POSTGRES_DB:-eduplexo_prod}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      GOMAXPROCS: "2"
      GOMEMLIMIT: "512MiB"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ─── EduBot AI Chatbot Service ─────────────────────────────────────────
  edubot:
    build:
      context: ./edubot-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      redis:
        condition: service_healthy
      backend-go:
        condition: service_started
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      JWT_SECRET: ${JWT_SECRET:-dev-secretttyt}
      GO_BACKEND_URL: http://backend-go:8080
      GO_BACKEND_TIMEOUT: "8"
      REDIS_URL: redis://redis:6379/1
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://app.eduplexo.com,https://admin.eduplexo.com}
      ENV: production
      LOG_LEVEL: INFO
      SESSION_TTL_SECONDS: "1800"
      MAX_HISTORY_PAIRS: "10"
      GEMINI_TIMEOUT_SECONDS: "10"
      RATE_LIMIT_PER_MINUTE: "20"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/chat/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  postgres_data:
    name: eduplexo_prod_postgres
  redis_data:
    name: eduplexo_prod_redis
