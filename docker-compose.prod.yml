# ═══════════════════════════════════════════════════════════════════════════
# Eduplexo — Hardened Production Docker Compose
# ═══════════════════════════════════════════════════════════════════════════
# Current Production Architecture (Non-AI Core Stack):
#   Internet → Nginx (80/443) → api.eduplexo.com → backend-go (8080)
#   backend-go → PostgreSQL (5432) + Redis DB 0 (6379)
#
# Future AI Architecture (Preserved for activation once keys are provided):
#   Internet → Nginx (80/443) → bot.eduplexo.com → edubot (8001)
#   edubot → backend-go (8080) + Redis DB 1 (6379)
#
# Constraints Enforced:
#   - PostgreSQL (5432) & Redis (6379) are NEVER published to the host
#   - backend-go (8080) is NEVER published to the host
#   - Exactly ONE backend-go instance (MemStore in-memory state cannot be replicated)
#   - All background jobs run in-process inside backend-go
#   - Frontend apps (school, super-admin, landing) run on Vercel
#   - Edubot microservice is preserved below for seamless future activation
# ═══════════════════════════════════════════════════════════════════════════

services:
  # ─── Nginx Reverse Proxy & TLS Termination ───────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/cache:/var/cache/nginx
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      backend-go:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate --no-verbose --tries=1 --spider http://127.0.0.1:80/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ─── Go Backend API Service (Single Instance) ─────────────────────────
  backend-go:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      PORT: "8080"
      APP_NAME: school
      APP_ENV: production
      ENV: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      COOKIE_SECURE: "true"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Brevo Transactional Email & Email OTP Verification
      BREVO_API_KEY: ${BREVO_API_KEY:?BREVO_API_KEY is required}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-verify@eduplexo.com}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-EduPlexo}
      BREVO_OTP_TEMPLATE_ID: ${BREVO_OTP_TEMPLATE_ID:-}
      BREVO_REPLY_TO_EMAIL: ${BREVO_REPLY_TO_EMAIL:-support@eduplexo.com}
      BREVO_REPLY_TO_NAME: ${BREVO_REPLY_TO_NAME:-EduPlexo Support}
      EMAIL_OTP_LENGTH: ${EMAIL_OTP_LENGTH:-6}
      EMAIL_OTP_EXPIRY_SECONDS: ${EMAIL_OTP_EXPIRY_SECONDS:-300}
      EMAIL_OTP_RESEND_COOLDOWN_SECONDS: ${EMAIL_OTP_RESEND_COOLDOWN_SECONDS:-60}
      EMAIL_OTP_MAX_VERIFY_ATTEMPTS: ${EMAIL_OTP_MAX_VERIFY_ATTEMPTS:-5}
      EMAIL_OTP_MAX_SEND_ATTEMPTS_PER_HOUR: ${EMAIL_OTP_MAX_SEND_ATTEMPTS_PER_HOUR:-5}
      # Optional AI Integrations — active when credentials are provided
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOMAXPROCS: "4"
      GOMEMLIMIT: "900MiB"
    volumes:
      - backend_uploads:/app/uploads
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "2.0"
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ─── PostgreSQL 16 Alpine Database ───────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_connections=100
      -c wal_buffers=16MB
      -c checkpoint_completion_target=0.9
      -c max_wal_size=2GB
      -c min_wal_size=1GB
      -c log_min_duration_statement=200
      -c log_checkpoints=on
      -c log_connections=on
      -c log_disconnections=on
      -c log_lock_waits=on
      -c log_temp_files=0
      -c track_activities=on
      -c track_counts=on
      -c track_io_timing=on
      -c "app.current_school_id="
    deploy:
      resources:
        limits:
          memory: 3072M
          cpus: "2.0"
        reservations:
          memory: 1536M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ─── Redis 7 Alpine Cache & Job Queue ─────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --tcp-keepalive 300
      --timeout 300
      --save 900 1
      --save 300 10
      --save 60 10000
      --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    deploy:
      resources:
        limits:
          memory: 640M
          cpus: "0.5"
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ─── Database Migrations (One-shot Runner) ────────────────────────────
  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend-go/migrations:/migrations:ro
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable",
        "up",
      ]
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── EduBot AI Chatbot Service (Preserved for Future Activation) ──────────
  # To enable Edubot once real AI credentials (GEMINI_API_KEY) are configured:
  #   1. Set GEMINI_API_KEY in .env
  #   2. Uncomment this service block
  #   3. Add 'edubot: condition: service_started' to nginx.depends_on above
  #   4. Uncomment bot.eduplexo.com server block in nginx/nginx.conf
  #
  # edubot:
  #   build:
  #     context: ./edubot-service
  #     dockerfile: Dockerfile
  #   restart: unless-stopped
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #     backend-go:
  #       condition: service_started
  #   environment:
  #     GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  #     GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
  #     OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  #     OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.0-flash-lite-001}
  #     GROQ_API_KEY: ${GROQ_API_KEY:-}
  #     JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  #     GO_BACKEND_URL: http://backend-go:8080
  #     GO_BACKEND_TIMEOUT: "8"
  #     REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  #     ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
  #     ENV: production
  #     LOG_LEVEL: INFO
  #     SESSION_TTL_SECONDS: "1800"
  #     MAX_HISTORY_PAIRS: "10"
  #     GEMINI_TIMEOUT_SECONDS: "30"
  #     RATE_LIMIT_PER_MINUTE: "20"
  #   expose:
  #     - "8001"
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 256M
  #         cpus: "0.5"
  #       reservations:
  #         memory: 128M
  #   healthcheck:
  #     test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/chat/health')\""]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 15s
  #   logging:
  #     driver: "json-file"
  #     options:
  #       max-size: "50m"
  #       max-file: "5"

volumes:
  postgres_data:
    name: eduplexo_prod_postgres
  redis_data:
    name: eduplexo_prod_redis
  certbot_webroot:
    name: eduplexo_certbot_webroot
  certbot_certs:
    name: eduplexo_certbot_certs
  backend_uploads:
    name: eduplexo_backend_uploads
